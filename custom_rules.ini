[Practice]
; Practice from the first menu: the keys 1-9 and 0 start a fight; with 2-4 players chosen all the knights fight
; together (3-4 need game controllers, see the README).
; keyN: the lair (1-24) whose monsters the key starts, or black_knight (one player against a Black Knight;
;       with more players, knight against knight). The lair decides the monster type and how many, on its
; ground, as in the game: the number grows with the knight's strength and hit points and shrinks with its
; fighting power. With 2-4 knights their strength and hit points are added up for this.
;   forest:    1 ratmen 10, 2 axe troggs 10, 3 axe troggs 14, 4 ratmen 14, 5 ratmen 14, 6 axe troggs 13
;   wasteland: 7 Baloks 4, 8 Baloks 3, 9 Baloks 5, 10-12 wasteland troggs 10
;   swamp:     13-15 mudmen 5, 16 trolls 7, 17 mudmen 6, 18 trolls 6
;   moors:     19 spear troggs 4, 20 spear troggs 5, 21 spear troggs 6, 22 war beasts 9, 23 axe troggs 13,
;              24 war beasts 8
