;   lairs  = only special_item_lairs of the 24 lairs hold special items, spread evenly over the map's four
;            quarters (the four key regions, six lairs each: with 8, two in each), and each of them at least one:
;            each kind is rolled at its chance below, and when none comes, one is drawn (each kind once before any
;            comes twice; the chances weigh the draw, 0 = never). With 8 lairs and all five at 10 % that is about
;            8.7 items. Which lairs, and which kinds in them, is fixed at the start of a game; the item itself is
;            drawn the first time the chest is looked into. The dragon's hoard: each kind at its chance, as with
;            chance.
