guardian_damage = 10                ; 0-127
guardian_second_attack_damage = 8   ; 0-127
dragon_hp = 200                     ; 1-999
dragon_damage = 30                  ; 0-127
dragon_second_attack_damage = 20    ; 0-127
dragon_parts_hp = 50                ; 1-999
dragon_parts_damage = 10            ; 0-127
talisman_min_damage = 5             ; 0-127
; Hit recovery (fix K6), in tenths of a second: after a hit, further hits on the dragon or the Guardian do
; not count for this long, so a quick series of blows cannot keep them from fighting back. 0 = as the game.
dragon_hit_recovery = 8             ; 0-50
guardian_hit_recovery = 8           ; 0-50

[Practice]
; Practice from the first menu: the keys 1-9 and 0 start a fight; with 2-4 players chosen all the knights fight
; together (3-4 need game controllers, see the README).
; keyN: the lair (1-24) whose monsters the key starts, or black_knight (one player against a Black Knight;
;       with more players, knight against knight). The lair decides the monster type and how many, on its
; ground, as in the game: the number grows with the knight's strength and hit points and shrinks with its
; fighting power. With 2-4 knights their strength and hit points are added up for this.
;   forest:    1 ratmen 10, 2 axe troggs 10, 3 axe troggs 14, 4 ratmen 14, 5 ratmen 14, 6 axe troggs 13
;   wasteland: 7 Baloks 4, 8 Baloks 3, 9 Baloks 5, 10-12 wasteland troggs 10
;   swamp:     13-15 mudmen 5, 16 trolls 7, 17 mudmen 6, 18 trolls 6
;   moors:     19 spear troggs 4, 20 spear troggs 5, 21 spear troggs 6, 22 war beasts 9, 23 axe troggs 13,
;              24 war beasts 8
key1 = 1                            ; 1-24 or black_knight
key2 = 4                            ; 1-24 or black_knight
key3 = 10                           ; 1-24 or black_knight
key4 = 2                            ; 1-24 or black_knight
key5 = 22                           ; 1-24 or black_knight
key6 = 20                           ; 1-24 or black_knight
key7 = 8                            ; 1-24 or black_knight
key8 = 13                           ; 1-24 or black_knight
key9 = 18                           ; 1-24 or black_knight
key0 = black_knight                 ; 1-24 or black_knight
; team_knight_hits: in the 3-4 player team practice, do teammates' blows hurt each other (daggers always do).
team_knight_hits = off              ; on or off
; Against monsters: do the knights' blows, and their thrown daggers, hurt the other knights?
coop_knight_hits = off              ; on or off
coop_dagger_hits = off              ; on or off
; monster_target: nearest = every monster goes for the knight nearest to it; first = all go for the first knight
; (the game's way; when it falls, the next one). target_switch_margin: a monster changes to another knight only
; when that one is this many pixels nearer.
monster_target = nearest            ; nearest or first
target_switch_margin = 20           ; 0-200

[Debug]
; Aids for finding faults and measuring the game, off in play.
; Dragon debug mode (for testing the dragon): 1 = on the map the keys 1-4 make knight 1-4 the dragon's target,
; and Enter starts the dragon fight when the knight whose turn it is stands under the dragon. 0 = as the game (the
; dragon attacks only its own target, when it flies over it).
dragon_debug_mode = 0               ; 0 or 1
; Input log: after every fight SAVEHOOK.COM appends the fight's key presses, the input each knight's move was read
; from and the attacks picked to INPUT.LOG in the game folder; python -I tools/input_log.py INPUT.LOG shows them
; with the time from fire to attack. For finding out why a move came out wrong; off in play.
input_log = off                     ; on or off
; Pointer coordinates (D84): on = the mouse pointer's x and y are shown next to it on the screens with a pointer (the
; towns, the tavern, the shops, the item screen), as the game compares them with its buttons, and the point the
; game uses is marked with one pixel. For measuring a button that reacts in the wrong place. off = not shown.
pointer_coordinates = off           ; on or off
; Read-outs for smooth_animation (D136), drawn in the top left corner in fights: draw_FPS = the pictures shown a
; second (54.6 when all of them fit at 6 a tick; a tick in which nothing moves counts in full), draw_TPS = the
; logic's ticks a second (9.1 when the fight keeps its pace, less when the CPU is too slow for the fight itself).
draw_FPS = no                       ; no or yes
draw_TPS = no                       ; no or yes
