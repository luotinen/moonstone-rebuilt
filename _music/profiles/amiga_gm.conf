# Music: General MIDI, with the Amiga version's sound effects (D82; AmigaSound_On.bat with Music_GM.bat). Both play
# on DOSBox-X's synth device from one SoundFont: the GM font (soundfonts\default.sf2, else the shipped
# soundfonts\GeneralUser-GS.sf2) merged with _music\amiga\amiga.sf2 (tools\merge_soundfont.py; the switches and
# Start.bat make it again when either changes). The GM part is 6 dB quieter, so that both suit the mixer level of the
# effects. The synth device takes no fluid.* settings: its reverb and chorus are FluidSynth's own (tested 14 Nov 2026).
[midi]
mididevice = synth
midiconfig = _music\amiga\amiga_gm.sf2
