# Music: General MIDI with a SoundFont (soundfonts\default.sf2)
[midi]
mididevice = fluidsynth
# Reverb and chorus recommended for GeneralUser GS by its author (its README, DOSBox-X section);
# FluidSynth's own defaults make the chorus too strong and the reverb sound like a small room
fluid.reverb.roomsize = 0.5
fluid.reverb.damping  = 0.3
fluid.reverb.width    = 0.8
fluid.reverb.level    = 0.7
fluid.chorus.number   = 4
fluid.chorus.level    = 0.55
fluid.chorus.speed    = 0.36
fluid.chorus.depth    = 3.6
