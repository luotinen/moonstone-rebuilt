# Moonstone: A Hard Days Knight - Moonstone Rebuilt, DOSBox-X settings
# Start with Start.bat. The music setting comes from music.conf (Music_*.bat switches it).

[sdl]
# Moonstone uses no mouse. A click must not capture the mouse: the intro reads the keyboard port itself, and mouse
# bytes there would mix with the key presses (Enter and Space then no longer skip the intro).
autolock = false
fullscreen = false
windowresolution = 1280x960
# OpenGL fixes the black screen on some machines (GOG forum) and allows shaders
output = opengl
showmenu = true
# Key and controller bindings (Main -> Mapper editor, F11+M) are saved in this folder, so a controller set up here
# (D-pad, an inverted axis; README, "Game controllers") does not change other DOSBox-X games
mapperfile = moonstone.map

[dosbox]
title = Moonstone Rebuilt
machine = svga_s3
memsize = 16
# Save states: 100 slots (Capture menu). F11+S / F11+L save and load the chosen slot (default 1).
# Save before every fight (D6) and at the start of every human turn on the map (D7): SAVEHOOK.COM renames the game
# for about a second, in turn to TURN1-TURN4 (slots 91-94) or FIGHT1-FIGHT5 (slots 96-100). The autosave check runs
# every second and never saves for other programs (-1). One slot per name: when the second's wait spans two checks,
# both saves go into the same slot. SAVEHOOK.SLT remembers the next number of each, so a crash can be undone by
# loading the newest slot. DOSBox-X allows 9 names, so slot 95 is not used.
# In original mode (Fixes_Off.bat) there is no SAVEHOOK, so there are no automatic saves.
saveslot = 1
autosave = 1 -1 TURN1:91 TURN2:92 TURN3:93 TURN4:94 FIGHT1:96 FIGHT2:97 FIGHT3:98 FIGHT4:99 FIGHT5:100
saveremark = false
# These saves are taken under the program names TURN1-4 and FIGHT1-5; load them without the name-mismatch question
forceloadstate = true

[render]
# 4:3 like the original monitor. "sharp" = crisp, evenly sized pixels; for a CRT look try e.g. crt-lottes-fast
aspect = true
glshader = sharp
scaler = none

[cpu]
core = auto
# GOG's default 9000 makes menus and animations too fast; the community-measured correct speed is 4000
cycles = fixed 4000

[mixer]
rate = 48000

[sblaster]
# Sound effects (digitised samples), MOON.CFG: SOUND=SOUNDBLASTER
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5
oplmode = auto
oplemu = nuked

[midi]
mpu401 = intelligent
# mididevice comes from music.conf
mt32.romdir = mt32-roms
fluid.soundfont = soundfonts\default.sf2

[keyboard]
# No PS/2 mouse on the keyboard controller (see [sdl] autolock)
aux = false

[dos]
# No mouse driver either
int33 = false

[joystick]
# Fixes the drifting joystick and the menu cursor sliding down (GOG forum)
timed = false
# Game controllers (README, "Game controllers"). The game reads joystick A for player 1 (fire: buttons 1 and 2) and
# joystick B for player 2 (buttons 3 and 4). auto: one controller is both (its right stick is player 2); two
# controllers, one per player: 2axis. Controller_PlayStation.bat and Controller_Standard.bat set it (and moonstone.map).
joysticktype = auto

[autoexec]
@echo off
mount c .
c:
rem Both modes use unpacked programs: the packed originals (EXEPACK) fail when DOS loads them into the lowest
rem 64 KB, and LOADFIX would leave too little memory. Original mode (ORIGINAL.FLG) has no SAVEHOOK.
if not exist ORIGINAL.FLG savehook
ms
exit
