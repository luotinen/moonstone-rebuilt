; Moonstone Rebuilt - custom game rules
;
; Custom_rules_on.bat     use the custom rules in custom_rules.ini (restart DOSBox-X afterwards)
; Custom_rules_off.bat    use the default rules (the normal game); custom_rules.ini is kept
; Custom_rules_reset.bat  restores custom_rules.ini to the default state (a copy of this file)
;
; The values in custom_rules-default.ini are the normal game's. Edit custom_rules.ini, not this file.
; A value that is not valid stops Custom_rules_on.bat with a message, and nothing is changed.
; The custom rules work only with the fixes on (Fixes_On.bat); in original mode they wait until the fixes are back on.

[Rules]
; Ratmen disease: on = a ratman's bite silently costs a life point every moon phase until healed (the original game),
; off = removed (fix K17).
ratmen_disease = off
; Curses, rolled each time a scroll is read, in percent (steps of about 0.8 %). 0 = never cursed.
; Scroll of the Hawk: lands in a random place. Scroll of Protection: reversed controls in the next fight.
hawk_curse_chance = 12.5
protection_curse_chance = 8.6
; Most gold a knight can carry (0-32767). Anything above is lost.
max_gold = 150
; Most life points from the healer, healing potions, Stonehenge and the home village (1-99).
max_lives = 5
; Home village druids: below_3 = +1 life point if the knight has fewer than 3 (the original),
; below_max = +1 life point if fewer than max_lives, full = back to max_lives and full hit points.
village_heal = below_3
; Where the druids heal: home = only in the knight's own home village (the original; the other villages
; do not react to it), any = in any of the four villages.
village_heal_where = home
; E key (ends the turn): none = nothing else, full = also restores full hit points.
rest_heal = none
; Days per moon phase (1-100).
moon_days = 4
; Experience points per ability point, by the number of human players.
xp_per_stat_1_player = 3
xp_per_stat_2_players = 2
xp_per_stat_3_players = 1
xp_per_stat_4_players = 1

[Weapons]
; Damage the weapon adds to every hit (on top of the move's damage and strength), as in the game.
long_sword = 0
broadsword = 2
claymore = 3
sword_of_sharpness = 5

[Armour]
; Maximum hit points the armour adds (-100-100), as in the game: armour does not reduce damage in Moonstone.
padded_hp = 0
chain_mail_hp = 10
plate_mail_hp = 20
battle_armour_hp = 30

; ----------------------------------------------------------------------------------------------------------------------
; The knights. [Knight1]-[Knight4] are the four knights in the order of the selection screen (each starts in its own
; corner and has its own home village); [Black] is every knight that the computer plays (the Black Knights).
;
; mode               permadeath    the knight is out of the game when its last life point is gone (the original)
;                    reincarnation on its next turn the knight starts again from the values below, at its start
;                    respawn       on its next turn the knight is back at its start with max_lives life points and
;                                  full hit points; it keeps its abilities and whatever the winner did not take
;                    invulnerable  never loses its last life point; a winner still takes items as usual
; strength, constitution, endurance  1-99. Training, Math and Mythral raise an ability only up to 5.
; lives              life points at the start (1-99)
; hp_bonus           added to the maximum hit points (10 x constitution + 10 + armour + 20 per ring)
; gold, experience, daggers   at the start
; weapon             long_sword, broadsword, claymore or sword_of_sharpness (its damage is set in [Weapons])
; armour             padded, chain_mail, plate_mail or battle_armour (its hit points are set in [Armour])
; items              how many of each at the start
; keys               0-4: the knight starts with that many of the four keys. A key still lies in each region's
;                    lair, so the knight can find one it already has. With 4 the Valley is open at once.
; moonstones         0-4 Moonstones at the start (one per moon phase)

[Knight1]
mode = permadeath
strength = 1
constitution = 1
endurance = 1
lives = 5
hp_bonus = 0
gold = 10
experience = 0
daggers = 10
weapon = long_sword
armour = padded
healing_potions = 0
gems_of_seeing = 0
