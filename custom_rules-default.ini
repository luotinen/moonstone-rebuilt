; Moonstone Rebuilt - custom game rules
;
; Custom_rules_on.bat     use the custom rules in custom_rules.ini (restart DOSBox-X afterwards)
; Custom_rules_off.bat    use the default rules (the normal game); custom_rules.ini is kept
; Custom_rules_reset.bat  restores custom_rules.ini to the default state
;
; Edit custom_rules.ini. custom_rules-default.ini holds the normal game's values, which Custom_rules_reset.bat
; copies back into custom_rules.ini; leave that file as it is.
; Every setting shows its allowed values after the ';'. Values above the normal game's limits are allowed; the
; bounds only keep the game from breaking. Custom_rules_on.bat checks every value first: if one is missing, misspelt
; or out of bounds, it says which one, and nothing is changed.
; The custom rules work only with the fixes on (Fixes_On.bat); in original mode they wait until the fixes are back on.

[Parental]
; For parents: the game shows graphic violence (blood, beheadings, bodies split in two). Mindscape rated it for 12
; and up, but with the normal settings it is closer to 16 or 18. The age rating:
;   K18           everything as the game: blood (or gore off) as chosen in its options, all the death animations
;   K16           blood as chosen in the game's options, but no fatalities: the deaths are those of gore off
;   K12           gore off: no blood at all (a small X where a blow lands), whatever the game's options say
;   K16_permanent as K16, and from then on only K16 or K12 can be chosen here
;   K12_permanent as K12, and from then on only K12
; Set it, then run Custom_rules_on.bat. PARENTAL.LCK in the game folder holds the highest rating allowed: the
; setup writes 18 for a new installation, a permanent rating lowers it for good, and without the file the game
; is locked to K12 (deleting it does not unlock anything). Only a new installation of Moonstone Rebuilt (a new
; folder) allows a higher rating again. While the limit is below 18, Start.bat starts the game only with the
; custom rules on, and Custom_rules_off.bat, Custom_rules_reset.bat and Fixes_Off.bat refuse.
; With PARENTAL.LCK missing, Start.bat refuses to launch until rules are rebuilt at K12.
age_rating = K18                    ; K18, K16, K12, K16_permanent or K12_permanent

[Rules]
; Speedrun mode: on = every other setting in this file is ignored. The game runs with the default rules and
; all the fixes, but keeps the game's own behaviour that runs rely on: every hit on the dragon and the
; Guardian counts (no hit recovery) and the dragon's hoard is kept from game to game. Scrolls are never
; cursed, so bad luck cannot spoil a run. No cheat codes, catch-up loot or anti-cheese rules (the game's own
; exploits stay). The age rating ([Parental]) still holds. Records still need the unmodified game.
speedrun_mode = off                 ; on or off
; Ratmen disease: on = a bite silently costs a life point every moon phase until healed (the original),
; off = removed (fix K17).
ratmen_disease = off                ; on or off
; Curses, rolled each time a scroll is read, in percent (steps of about 0.8 %). 0 = never cursed.
; Scroll of the Hawk: lands in a random place. Scroll of Protection: reversed controls in the next fight.
; Scroll of Haste: half the movement this turn. Scroll of the Wyrm: the dragon goes for the reader.
hawk_curse_chance = 12.5            ; 0-100
protection_curse_chance = 8.6       ; 0-100
haste_curse_chance = 12.5           ; 0-100
wyrm_curse_chance = 12.5            ; 0-100
; Most gold a knight can carry; anything above is lost. Checked after Math, as the tavern, the merchant or the High Temple is left (only if
; the gold grew there) and when taking gold from a chest (the rest stays in the chest).
max_gold = 150                      ; 0-32767
; Most life points from the healer, healing potions, Stonehenge, the home village and respawn.
max_lives = 5                       ; 1-99
; Home village druids: below_3 = +1 life point if the knight has fewer than 3 (the original),
; below_max = +1 life point if fewer than max_lives, full = back to max_lives. Every visit restores full hit points.
village_heal = below_3              ; below_3, below_max or full
; Where the druids heal: home = only in the knight's own village (the original), any = in all four villages.
village_heal_where = home           ; home or any
; Healing when the day changes (every knight heals a share of its missing hit points): on_E_rest_heal = none (the
; original: a quarter, at least 1), fixed_and_endurance = rest_heal_fixed_percentage % of the missing hit points
; (at least 1) plus rest_heal_endurance_percentage % times the share of its endurance (movement) the knight had
; left when its last turn ended: E pressed at once 20 + 10 = 30 %, all walked 20 %; endurance left by a fight or a
; visit counts too. fixed_only = the fixed part only. full = the original, and E restores full hit points.
on_E_rest_heal = fixed_and_endurance   ; none, fixed_and_endurance, fixed_only or full
rest_heal_fixed_percentage = 20        ; 0-100
rest_heal_endurance_percentage = 10    ; 0-100
; Days per moon phase.
moon_days = 4                       ; 1-100
; CPU speed (DOSBox-X cycles). The map, menus and animations run too fast above 4000 (default_cycles). A fight
; runs at fight_cycles: the cycles with 1, 2, 3 and 4 knights. Given fewer numbers, each knight past the last one
; adds additional_cycles_per_knight (one number: 2600 and 650 = 2600, 3250, 3900, 4550). After the fight the speed
; goes back to default_cycles. fight_cycles equal to default_cycles (and 0 per knight) = no change.
; All four expanded fight speeds (including the per-knight increment) must also be within 100-65535.
default_cycles = 4000               ; 100-65535. The same as cycles in moonstone-dosbox-x.conf
fight_cycles = 2600, 3250, 3500, 3750   ; 1-4 numbers, 100-65535 each
additional_cycles_per_knight = 650  ; 0-20000
; Deaths: a knight on its knees after a deadly blow, hit again before it lies down: extended = new deaths by the
; blow (split, thrust, back strike, a dagger where it hit), about a second longer on its knees; vanilla = only the
; game's own (the sweep takes the head off); off = no blood at all (as the game's gore off).
death_animations = extended         ; extended, vanilla or off
; Dragon debug mode (for testing the dragon): 1 = on the map the keys 1-4 make knight 1-4 the dragon's target,
; and Enter starts the dragon fight when the knight whose turn it is stands under the dragon. 0 = as the game (the
; dragon attacks only its own target, when it flies over it).
dragon_debug_mode = 0               ; 0 or 1
; Input buffer: an attack (fire, with its direction) pressed while the knight is still in its last move is made
; as soon as that move ends, instead of being lost (pressed at most about half a second before).
input_buffer = on                   ; on or off
; Chord window, in BIOS ticks (18 a second): a back direction pressed without fire waits this long before it turns
; the knight, so that back + up + fire (the dagger) or back + down + fire (the block) keeps the way the knight faced.
; Turning and walking back start that much later. 0 = as the game.
input_chord = 2                     ; 0-6
; An up or down direction let go just before fire still counts in that attack, in BIOS ticks (18 a second), if it was
; a short press and no new direction was pressed after it, so walking and then attacking stays a plain attack. 0 = off.
input_recent_direction = 3          ; 0-6
; Input log: after every fight SAVEHOOK.COM appends the fight's key presses, the input each knight's move was read
; from and the attacks picked to INPUT.LOG in the game folder; python -I tools/input_log.py INPUT.LOG shows them
; with the time from fire to attack. For finding out why a move came out wrong; off in play.
input_log = off                     ; on or off
; Co-op lairs: when a knight stops at a lair with other human players' knights next to it, the choices also offer
; "Lair with" that knight, or with 2-3 of them "Lair together (N knights)": all fight the lair's monsters together,
; friendly fire on. Knights 3 and 4 use a joystick or the keys I J K L and B (4 knights need a joystick). With
; several knights to fight, "Battle with ..." lists them. The chest after a win:
;   full   = each knight standing gets the whole chest in turn (the order drawn); the keys and Moonstones only once
;   shared = one chest, a little fuller (extra_loot_per_knight), taken in turn, first by the knight whose turn it
;            was, then in a drawn order: a click on the gold takes the gold divided by the knights (the last one
;            takes all that is left), an item one at a time
;   off    = no co-op lair fights
coop_lairs = full                   ; full, shared or off
; With coop_lairs = shared: more in the chest for every knight past the first, in percent of the chest
extra_loot_per_knight = 50          ; 0-100
; Sword enchantments: one lair chest in ten (and the dragon's hoard, one time in ten) holds an enchantment for a
; player's sword (not the Sword of Sharpness). Clicking it puts it on the knight's own sword, replacing one it had;
; the sword's name gets " of <enchantment>". It is lost with that sword (a better one bought, or the sword taken),
; and goes with the sword to a knight that takes it. Smite: the overhead chop does three times the damage (not
; two). Dragonbane: twice against the dragon. Fireblock: no burns from the dragon's fire while blocking. Gore (only
; with gore on; its effects stop while gore is off): three times the blood, and a knight it kills dies by the
; blow's death animation. Troggbane: kills troggs at one blow. Desertbane: twice against Baloks and hammer troggs.
; Swampbane: twice against mudmen, kills trolls at one blow. Ratbane: kills ratmen and axe troggs at one blow.
sword_enchantments = on             ; on or off
; The chance of an enchantment in a chest or the hoard, in percent (decided the first time it is opened)
sword_enchantment_chance = 10       ; 0-100
; Armour enchantments: as the sword enchantments, for armour. A chest or the hoard shows the knight's own armour; click
; it and the armour's name gets " of <enchantment>". It is lost with that armour (a better one bought, or taken with
; it), a new one replaces the old, and computer knights get none. Mithril: no movement lost. Adamantium: +10 HP.
; Danu: +10 HP every turn. Wyrm: the dragon does not attack. Fireproof: as a Talisman of the Wyrm. Venomproof: no
; ratmen's disease (found only with ratmen_disease on). Spellproof: not a scroll's target, own scrolls not cursed.
; Rebirth: once, a lost fight costs no life and the knight is moved to Stonehenge. Daggerward: no damage from daggers.
armour_enchantments = on            ; on or off
; The chance of one in a chest or the hoard, in percent (decided the first time it is opened)
armour_enchantment_chance = 10      ; 0-100
; Cheat codes, typed in the item screen, in a fight or on the map (the list: CHEATS.md).
cheat_codes = yes                   ; yes or no
; Anti-cheese: no repeated tricks against the computer. yes (default): knights and monsters do not walk in under a knight's overhead chop already
; in the air; walking monsters keep out of reach until level with the knight (TOOEASY's rule, CHEATS.md; Black Knight fights always use it); the dragon's
; long fire follows a knight's depth only a random distance, and a 4th blow in a row on the dragon without it hurting you may end in its deadly bite
; (50 %, from the 5th 80 %). blackknights_only: only the knights' chop rule. no: none.
anticheese = yes                    ; yes, blackknights_only or no
; Catch-up (the game, not practice): a human knight behind the leading human knight (Moonstones 40 points each,
; keys 15, lives 10, each point of strength, constitution, endurance and experience 5, HP up to 10) finds more in
; a lair's chest the first time it wins it: per 30 points behind (at most 4 times) 10 gold and a magic item more,
; and from 90 behind a Scroll of Acquisition too. Any human knight on its last life or at a quarter of its HP or
; less has a 10 % chance of a healing potion in the chest (both: 25 %). At most
; +50 % of the lair's own gold, one healing potion more at most and only for a knight that has none (a potion
; drawn as a magic item becomes another item), a Scroll of Acquisition only for a knight that has none.
catchup = yes                       ; yes or off
; Saves (DOSBox-X save states): autosave_and_manual = the automatic saves before every fight and turn, and your
; own with F11+S (as before); autosave_only = only the automatic ones; manual_only = only your own; none = none.
; DOSBox-X still takes F11+S, but with autosave_only or none, loading such a save stops the game at the next
; turn, fight or roll, and the title bar shows LOADAUTO (load the newest automatic save instead) or NOSAVES.
save_mode = autosave_and_manual     ; autosave_and_manual, autosave_only, manual_only or none
; on = loading a save does not change how the tavern dice, Math the Wizard, Mythral the Mystic and the scroll
; curses turn out: each comes out as it did the first time. (You can still decide not to play again.)
prevent_savescumming = off          ; on or off
; on = the merchant also buys: click one of your daggers, your weapon, your armour or your horse on your side of the
; merchant screen to sell it for half its price (rounded down). A sold weapon is replaced by the long sword and sold armour by
; padded armour, for free; the armour takes its hit points with it. A sold horse is simply gone. The long sword, padded
; armour and magic items are not bought. The Sword of Sharpness is sold at the High Temple, which always buys it.
merchant_selling = on               ; on or off
; on = click a worse sword, armour or horse on the merchant's side than your own: you get it free in exchange for yours.
; Buying a better one (or changing between black charger and dappled horse) credits half of the old one's price.
; The Sword of Sharpness cannot be exchanged.
merchant_trade_in = on              ; on or off
; Computer knights: on or off. With off, a new campaign has only the 1-4 players' knights, no Black Knights on the map.
computer_knights = on
; Black Knights: smart or classic. classic is the original game's computer knights. smart: on the map they go to lairs that
; still hold something, get a heal first when weak, and with four keys head for Stonehenge; in a fight they line up early,
; wait at the edge of reach instead of walking into a blow, punish a swing, and sometimes block.
black_knight_ai = smart
; Timed defence (on or off). on: a defence counts only if made after the attack's animation has started, so holding one up in advance never helps.
; A swing: block it (back + down + fire) in time: no damage, the attacker staggers (time for your own blow) and your next swing is faster (a lunge's damage); too
; early: a fifth of the damage. A dodge does not help. A thrust: dodge it (down + fire) in time: it misses and the attacker staggers; too early:
; it hits. A block does not help. An overhead chop: dodge it in time and it misses, or strike first: your lunge during its chop is a fast riposte (a backward thrust's damage).
; A dagger can only be avoided by moving up or down. The backward thrust is the fastest blow. Axe and spear troggs can be blocked within 6 ticks
; of the block's start. off: the game's own block.
timed_defence = on
; The longest a block or dodge held from its start still counts, in BIOS ticks (18 a second).
defence_window = 18
; After a good block: how long your next swing stays faster (it skips the wind-up), in ticks.
fast_swing_time = 30
; How long a blocked attacker cannot act, in ticks (half this after a computer knight's block).
stagger_time = 16
; Computer knights with black_knight_ai = smart: percent of attacks defended in time, and defended too late (a fifth of the damage).
; Against a thrust or chop the first is halved and a late defence does nothing. Purple: computer knights in the four knight places;
; Black: those in monster places.
purple_knight_defence = 15
purple_knight_mistimed = 10
black_knight_defence = 25
black_knight_mistimed = 15
; Attacks a computer knight cannot defend at all after a good defence.
computer_defence_pause = 2
; Horses at the merchant: on or off. With off there are no horses, icons or horse effects.
horses = on
; The chance (percent) that the fourth horse slot holds a rare horse, rolled once as a town is entered:
rare_horse_chance = 10              ; 0-100
; Each horse: its price; movement per turn (added); speed in forest and swamp and speed in mountains and at the
; edges of the map, in eighths of the full speed (8 = full).
brown_horse_price = 20              ; 0-999
brown_horse_movement = 1            ; -20 to 20
brown_horse_forest_swamp_speed = 4  ; 1-8
brown_horse_mountains_edges_speed = 2  ; 1-8
light_horse_price = 40              ; 0-999
light_horse_movement = 2            ; -20 to 20
light_horse_forest_swamp_speed = 6  ; 1-8
light_horse_mountains_edges_speed = 4  ; 1-8
armoured_horse_price = 60           ; 0-999
armoured_horse_movement = 3         ; -20 to 20
armoured_horse_forest_swamp_speed = 7  ; 1-8
armoured_horse_mountains_edges_speed = 6  ; 1-8
black_horse_price = 80              ; 0-999
black_horse_movement = 3            ; -20 to 20
black_horse_forest_swamp_speed = 8  ; 1-8
black_horse_mountains_edges_speed = 8  ; 1-8
dappled_horse_price = 80            ; 0-999
dappled_horse_movement = 5          ; -20 to 20
dappled_horse_forest_swamp_speed = 7  ; 1-8
dappled_horse_mountains_edges_speed = 6  ; 1-8
; Experience points per ability point, by the number of human players:
xp_per_stat_1_player = 3            ; 1-1000
xp_per_stat_2_players = 2           ; 1-1000
xp_per_stat_3_players = 1           ; 1-1000
xp_per_stat_4_players = 1           ; 1-1000

; ---------------------------------------------------------------------------------------------------------------------
; The knights. [Knight1_blue]-[Knight4_red] are the four knights in the order of the selection screen: Sir Godber (blue),
; Sir Richard (orange), Sir Jeffrey (green) and Sir Edward (red). The colour in a name is the
; knight's own; colour = below can change it. [Black] is every knight that the computer plays.
;
; home_village: north_west, north_east, south_west or south_east. The knight starts there (at that corner of the
;         map), comes back there with respawn and reincarnation, and only its druids heal it (unless
;         village_heal_where = any). Two knights can share a village. Originally Sir Godber north_west,
;         Sir Richard north_east, Sir Jeffrey south_west, Sir Edward south_east.
;
; colour: blue, orange, green, red, black, or any colour as #RGB: one hex digit 0-F each for red, green and
;         blue (e.g. #80F purple, #FF0 yellow, #FFF white), the brightest shade; the darker shades follow.
;         Only how the knight is drawn: in fights, on the item screen and the status panel. On the map a #RGB
;         knight shows as the nearest of the five named colours (the map icons are pictures). The game tells
;         the knights apart by their place, not their colour, so any colours work, also two knights in the
;         same one. The selection screen keeps the original portraits. At 10 HP or less in a fight
;         a knight's colours pulse lighter and back (red: darker); black, purple, grey and white knights
;         and [Black] do not pulse.
; mode: permadeath    the knight is out of the game when its last life point is gone (the original)
;       reincarnation on its next turn the knight starts again from the values below, at its start
;       respawn       on its next turn the knight is back at its start with max_lives life points and full hit
;                     points; it keeps its abilities and whatever the winner did not take
;       invulnerable  never loses its last life point; a winner still takes items as usual
; Maximum hit points = 10 x constitution + 10 + armour + rings + hp_bonus; the game keeps them at most 999.
; keys: the knight starts with that many of the four keys. A key still lies in each region's lair, so the
; knight can find one it already has. With 4 the Valley is open at once.

[Knight1_blue]
colour = blue                       ; blue, orange, green, red, black or #RGB
home_village = north_west           ; north_west, north_east, south_west or south_east
mode = permadeath                   ; permadeath, reincarnation, respawn or invulnerable
strength = 1                        ; 1-99
constitution = 1                    ; 1-99
endurance = 1                       ; 1-99
lives = 5                           ; 1-99
hp_bonus = 0                        ; 0-900
gold = 10                           ; 0-20000
experience = 0                      ; 0-20000
daggers = 10                        ; 0-99
